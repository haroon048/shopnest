name: shopnest
description: ShopNest - Shop Smart, Live Better. A complete e-commerce app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # State management (sirf Provider - simple aur interview-friendly)
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.0
  google_sign_in: ^6.2.1
  # Local storage (onboarding "show once" logic ke liye)
  shared_preferences: ^2.3.2
  firebase_storage: ^12.4.0



  # REST API (Cloudinary image upload isi se hoga)
  http: ^1.2.2

  # Images
  image_picker: ^1.0.7
  cached_network_image: ^3.4.1

  # UI / animations
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.1
  lottie: ^3.1.3
  flutter_animate: ^4.5.2
  badges: ^3.1.2
  google_fonts: ^6.2.1

  # Helpers
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/banners/
    - assets/images/categories/
    - assets/images/placeholders/
    - assets/icons/
    - assets/animations/
